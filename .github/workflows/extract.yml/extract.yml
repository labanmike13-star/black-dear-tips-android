name: Extract Android project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o BLACK-DEAR-TIPS-ANDROID-APP-PROJECT.zip -d extracted
          cp -r extracted/* .
          rm -rf extracted
          rm -f BLACK-DEAR-TIPS-ANDROID-APP-PROJECT.zip

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Android app project" || exit 0
          git push
